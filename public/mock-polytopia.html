<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<meta charset="UTF-8">
<title>Memory Palace — Polytopia Style</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a0a2e; overflow: hidden; font-family: 'Georgia', serif; }
  canvas { display: block; }
  #label {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
    color: white; padding: 8px 20px; border-radius: 20px;
    font-size: 14px; letter-spacing: 1px; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #title {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.9); font-size: 13px; letter-spacing: 3px;
    text-transform: uppercase; opacity: 0.7;
  }
  #style-tag {
    position: fixed; top: 16px; right: 20px;
    background: #e8a838; color: #1a0a2e; font-size: 11px;
    letter-spacing: 2px; padding: 4px 12px; border-radius: 12px;
    font-weight: bold; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="title">Memory Palace</div>
<div id="style-tag">Polytopia Style</div>
<div id="label" id="label"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2d1b4e);
scene.fog = new THREE.Fog(0x2d1b4e, 35, 65);

// Isometric-ish camera
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(22, 18, 22);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);
controls.minPolarAngle = Math.PI / 6;
controls.maxPolarAngle = Math.PI / 2.2;

// Lighting — flat Polytopia feel
const ambient = new THREE.AmbientLight(0xffeedd, 1.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff0cc, 2.5);
sun.position.set(15, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 100;
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
scene.add(sun);

// Rim light
const rim = new THREE.DirectionalLight(0x7744ff, 0.8);
rim.position.set(-10, 15, -10);
scene.add(rim);

// Helper: flat toon material
function toon(color, emissive = 0x000000, emissiveIntensity = 0) {
  return new THREE.MeshToonMaterial({
    color,
    emissive,
    emissiveIntensity,
  });
}

// Wing palettes — Polytopia uses vivid biome colors
const palettes = {
  people:      { base: 0x4fc3f7, roof: 0x0288d1, accent: 0xe1f5fe, ground: 0x1565c0 },
  projects:    { base: 0xa5d6a7, roof: 0x388e3c, accent: 0xf1f8e9, ground: 0x1b5e20 },
  stories:     { base: 0xffcc80, roof: 0xf57c00, accent: 0xfff8e1, ground: 0xe65100 },
  preferences: { base: 0xce93d8, roof: 0x7b1fa2, accent: 0xf3e5f5, ground: 0x4a148c },
};

// Island — hex-ish platform
function makeHexIsland(radius, color, y = 0) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    if (i === 0) shape.moveTo(x, z);
    else shape.lineTo(x, z);
  }
  shape.closePath();
  const extrudeSettings = { depth: 0.5, bevelEnabled: true, bevelSize: 0.3, bevelThickness: 0.2 };
  const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, y, 0);
  const mesh = new THREE.Mesh(geo, toon(color));
  mesh.receiveShadow = true;
  return mesh;
}

// Central island
const central = makeHexIsland(5.5, 0x7c4dff, -0.3);
scene.add(central);

// Wing sub-islands
const wingData = [
  { key: 'people',      pos: [0, -0.2, -14],   angle: 0,           label: 'People' },
  { key: 'projects',    pos: [14, -0.2, 0],    angle: Math.PI/2,   label: 'Projects' },
  { key: 'stories',     pos: [0, -0.2, 14],    angle: Math.PI,     label: 'Stories' },
  { key: 'preferences', pos: [-14, -0.2, 0],   angle: -Math.PI/2,  label: 'Preferences' },
];

wingData.forEach(({ key, pos }) => {
  const pal = palettes[key];
  const island = makeHexIsland(6, pal.ground, pos[1]);
  island.position.set(pos[0], 0, pos[2]);
  scene.add(island);
});

// Bridges between islands
function makeBridge(from, to) {
  const dir = new THREE.Vector3(to[0] - from[0], 0, to[2] - from[2]);
  const len = dir.length();
  const mid = [(from[0]+to[0])/2, 0.2, (from[2]+to[2])/2];
  const geo = new THREE.BoxGeometry(1.2, 0.25, len - 9);
  const mesh = new THREE.Mesh(geo, toon(0x8d6e63));
  mesh.position.set(mid[0], mid[1], mid[2]);
  mesh.rotation.y = Math.atan2(dir.x, dir.z);
  mesh.castShadow = true;
  scene.add(mesh);
  // Bridge railings
  [-0.55, 0.55].forEach(offset => {
    const rGeo = new THREE.BoxGeometry(0.12, 0.4, len - 9);
    const rMesh = new THREE.Mesh(rGeo, toon(0xa1887f));
    rMesh.position.set(mid[0], mid[1] + 0.2, mid[2]);
    rMesh.rotation.y = Math.atan2(dir.x, dir.z);
    rMesh.translateX(offset * Math.cos(rMesh.rotation.y));
    rMesh.translateZ(-offset * Math.sin(rMesh.rotation.y));
    scene.add(rMesh);
  });
}

makeBridge([0,0,0], [0,0,-14]);
makeBridge([0,0,0], [14,0,0]);
makeBridge([0,0,0], [0,0,14]);
makeBridge([0,0,0], [-14,0,0]);

// Building types per wing
function makePeopleBuilding(x, z, size) {
  const g = new THREE.Group();
  const pal = palettes.people;
  const h = size * 1.8;
  // Round tower body
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(size * 0.55, size * 0.6, h, 8),
    toon(pal.base)
  );
  body.position.y = h / 2;
  body.castShadow = true;
  g.add(body);
  // Cone roof
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(size * 0.75, size * 1.0, 8),
    toon(pal.roof)
  );
  roof.position.y = h + size * 0.5;
  roof.castShadow = true;
  g.add(roof);
  // Window accents
  if (size > 1.2) {
    const wGeo = new THREE.BoxGeometry(0.2, 0.3, 0.1);
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * Math.PI * 2;
      const w = new THREE.Mesh(wGeo, toon(pal.accent));
      w.position.set(Math.cos(angle) * size * 0.56, h * 0.6, Math.sin(angle) * size * 0.56);
      w.rotation.y = angle;
      g.add(w);
    }
  }
  g.position.set(x, 0, z);
  return g;
}

function makeProjectBuilding(x, z, size) {
  const g = new THREE.Group();
  const pal = palettes.projects;
  const h = size * 2.0;
  // Square base
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(size * 0.9, h, size * 0.9),
    toon(pal.base)
  );
  body.position.y = h / 2;
  body.castShadow = true;
  g.add(body);
  // Pyramid roof
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(size * 0.8, size * 0.9, 4),
    toon(pal.roof)
  );
  roof.position.y = h + size * 0.45;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  // Crystal spire
  if (size > 1.3) {
    const spire = new THREE.Mesh(
      new THREE.ConeGeometry(size * 0.15, size * 0.8, 4),
      toon(0x80deea, 0x00bcd4, 0.5)
    );
    spire.position.y = h + size * 0.9 + size * 0.4;
    g.add(spire);
  }
  g.position.set(x, 0, z);
  return g;
}

function makeStoryBuilding(x, z, size) {
  const g = new THREE.Group();
  const pal = palettes.stories;
  const h = size * 1.4;
  // Wide lodge body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(size * 1.3, h, size * 1.1),
    toon(pal.base)
  );
  body.position.y = h / 2;
  body.castShadow = true;
  g.add(body);
  // Gable roof — prism
  const roofGeo = new THREE.CylinderGeometry(0.01, size * 0.95, size * 0.7, 4);
  const roof = new THREE.Mesh(roofGeo, toon(pal.roof));
  roof.position.y = h + size * 0.3;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  g.add(roof);
  // Chimney
  const chimney = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.6, 0.2),
    toon(0x8d6e63)
  );
  chimney.position.set(size * 0.35, h + 0.45, 0);
  g.add(chimney);
  g.position.set(x, 0, z);
  return g;
}

function makePrefBuilding(x, z, size) {
  const g = new THREE.Group();
  const pal = palettes.preferences;
  const h = size * 1.6;
  // Hexagonal body
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(size * 0.6, size * 0.65, h, 6),
    toon(pal.base)
  );
  body.position.y = h / 2;
  body.castShadow = true;
  g.add(body);
  // Flat topped with crenellations
  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(size * 0.65, size * 0.65, 0.25, 6),
    toon(pal.roof)
  );
  top.position.y = h + 0.125;
  g.add(top);
  // Battlements
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2;
    const merlon = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.35, 0.2),
      toon(pal.roof)
    );
    merlon.position.set(Math.cos(angle) * size * 0.55, h + 0.4, Math.sin(angle) * size * 0.55);
    g.add(merlon);
  }
  g.position.set(x, 0, z);
  return g;
}

// Central Keep — Polytopia style (grand & colorful)
function makeCentralKeep() {
  const g = new THREE.Group();
  // Multi-tier base
  [
    { r: 2.8, h: 1.2, color: 0x9c27b0 },
    { r: 2.2, h: 2.0, color: 0x7b1fa2 },
    { r: 1.6, h: 2.0, color: 0x6a1b9a },
  ].forEach(({ r, h, color }, i) => {
    const tier = new THREE.Mesh(
      new THREE.CylinderGeometry(r * 0.95, r, h, 8),
      toon(color)
    );
    tier.position.y = i === 0 ? h/2 : [0.6, 1.2+1.0, 1.2+2.0+1.0][i];
    tier.castShadow = true;
    g.add(tier);
  });
  // Crown towers
  [[1.8, 0], [-1.8, 0], [0, 1.8], [0, -1.8]].forEach(([tx, tz]) => {
    const tower = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.45, 3.5, 8),
      toon(0x8e24aa)
    );
    tower.position.set(tx, 1.75, tz);
    tower.castShadow = true;
    g.add(tower);
    const cap = new THREE.Mesh(
      new THREE.ConeGeometry(0.55, 0.9, 8),
      toon(0xffd700, 0xffa000, 0.4)
    );
    cap.position.set(tx, 3.7, tz);
    g.add(cap);
  });
  // Central spire
  const spire = new THREE.Mesh(
    new THREE.ConeGeometry(0.8, 2.5, 8),
    toon(0xffd700, 0xffa000, 0.6)
  );
  spire.position.y = 6.5;
  g.add(spire);
  // Floating crystal
  const crystal = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.6),
    toon(0xe040fb, 0xce93d8, 1.0)
  );
  crystal.position.y = 9.5;
  g.add(crystal);
  return g;
}

scene.add(makeCentralKeep());

// Trees
function makeTree(x, z, color = 0x33691e) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.15, 0.7, 6),
    toon(0x5d4037)
  );
  trunk.position.y = 0.35;
  g.add(trunk);
  [[0, 0.9, 0, 1.0], [0, 1.5, 0, 0.7], [0, 2.0, 0, 0.45]].forEach(([x2, y, z2, r]) => {
    const foliage = new THREE.Mesh(
      new THREE.ConeGeometry(r, r * 1.3, 6),
      toon(color)
    );
    foliage.position.set(x2, y, z2);
    foliage.castShadow = true;
    g.add(foliage);
  });
  g.position.set(x, 0, z);
  return g;
}

// Place trees around wing islands
const treeColors = [0x33691e, 0x2e7d32, 0x558b2f, 0x1b5e20];
wingData.forEach(({ pos }, wi) => {
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const r = 5.2 + Math.random() * 0.5;
    const tx = pos[0] + Math.cos(angle) * r;
    const tz = pos[2] + Math.sin(angle) * r;
    scene.add(makeTree(tx, tz, treeColors[(wi + i) % treeColors.length]));
  }
});

// Generate buildings for each wing
const buildingMakers = {
  people: makePeopleBuilding,
  projects: makeProjectBuilding,
  stories: makeStoryBuilding,
  preferences: makePrefBuilding,
};

const buildingLabels = {
  people: ['A close friend', 'A mentor', 'A collaborator', 'Family', 'A teammate', 'An advisor', 'A co-founder'],
  projects: ['A product shipped', 'An open source tool', 'A side project', 'A design system', 'A startup', 'A prototype'],
  stories: ['A memory made', 'A lesson learned', 'A risk taken', 'A trip taken', 'A book read', 'A decision made'],
  preferences: ['A music taste', 'A food preference', 'A design principle', 'A philosophy held', 'A habit built'],
};

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hoverables = [];
const labelEl = document.getElementById('label');

wingData.forEach(({ key, pos }) => {
  const maker = buildingMakers[key];
  const labels = buildingLabels[key];
  const count = key === 'people' ? 14 : key === 'projects' ? 11 : key === 'stories' ? 16 : 13;
  for (let i = 0; i < count; i++) {
    const ring = Math.floor(i / 5);
    const indexInRing = i % 5;
    const r = 2.2 + ring * 2.1;
    const total = Math.min(count - ring * 5, 5);
    const angleOffset = (key === 'projects') ? Math.PI / 2 : (key === 'stories') ? Math.PI : (key === 'preferences') ? -Math.PI / 2 : 0;
    const angle = angleOffset + (indexInRing / total) * Math.PI * 2;
    const x = pos[0] + Math.cos(angle) * r;
    const z = pos[2] + Math.sin(angle) * r;
    const size = 0.7 + Math.random() * 0.9;
    const group = maker(x, z, size);
    group.userData.label = labels[i % labels.length];
    scene.add(group);
    hoverables.push({ group, label: group.userData.label });
  }
});

// Ground glow planes under each wing
wingData.forEach(({ key, pos }) => {
  const pal = palettes[key];
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(8, 8),
    new THREE.MeshBasicMaterial({ color: pal.base, transparent: true, opacity: 0.06, depthWrite: false })
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.set(pos[0], 0.01, pos[2]);
  scene.add(plane);
});

// Particle field (stars)
const starGeo = new THREE.BufferGeometry();
const starCount = 800;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 120;
  starPos[i * 3 + 1] = 10 + Math.random() * 30;
  starPos[i * 3 + 2] = (Math.random() - 0.5) * 120;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.6 }));
scene.add(stars);

// Hover detection
document.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let currentLabel = null;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  controls.update();

  // Rotate crystal
  scene.traverse(obj => {
    if (obj instanceof THREE.Mesh && obj.geometry.type === 'OctahedronGeometry') {
      obj.rotation.y = t * 0.8;
      obj.position.y = 9.5 + Math.sin(t * 1.2) * 0.3;
    }
  });

  // Twinkle stars
  stars.rotation.y = t * 0.01;

  // Hover detection
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(scene.children, true);

  let found = null;
  for (const hit of intersects) {
    let obj = hit.object;
    while (obj.parent && !obj.userData.label) obj = obj.parent;
    if (obj.userData.label) { found = obj.userData.label; break; }
  }

  if (found !== currentLabel) {
    currentLabel = found;
    labelEl.textContent = found || '';
    labelEl.style.opacity = found ? '1' : '0';
    document.body.style.cursor = found ? 'pointer' : 'default';
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
